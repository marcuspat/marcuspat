<rect x="568" y="96" width="8" height="8" rx="2" fill="#f85149"/>
<text x="584" y="104">scan secrets</text>

<rect x="560" y="123" width="248" height="26" rx="8" fill="#0d1117" stroke="#3fb950" stroke-opacity="0.45"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="6s" begin="3s" repeatCount="indefinite"/></rect>
<rect x="568" y="132" width="8" height="8" rx="2" fill="#3fb950"/>
<text x="584" y="140">install rust tooling</text>

<rect x="560" y="159" width="248" height="26" rx="8" fill="#0d1117" stroke="#a78bfa" stroke-opacity="0.45"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="6s" begin="4s" repeatCount="indefinite"/></rect>
<rect x="568" y="168" width="8" height="8" rx="2" fill="#a78bfa"/>
<text x="584" y="176">see the live SaaS</text>

<rect x="560" y="195" width="248" height="26" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-opacity="0.45"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="6s" begin="5s" repeatCount="indefinite"/></rect>
<rect x="568" y="204" width="8" height="8" rx="2" fill="#58a6ff"/>
<text x="584" y="212">weigh the evidence</text>
