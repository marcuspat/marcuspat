<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-label="Five stations in one pipeline: Gate the diff with turbo-flow, Map the codebase with codescope, Remember across sessions with git-versioned memory, Ship the tool as 7 crates, Operate the product with Ancuria.">
<title>Gate, Map, Remember, Ship, Operate</title>
<defs>
<filter id="vcglow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="840" height="250" rx="12" fill="#04060c" stroke="#10161f"/>
<g>
<circle cx="60" cy="60" r="1.2" fill="#dbe7ff"><animate attributeName="opacity" values="0.08;0.8;0.08" dur="3.3s" repeatCount="indefinite"/></circle>
<circle cx="780" cy="42" r="1.6" fill="#dbe7ff"><animate attributeName="opacity" values="0.08;0.8;0.08" dur="2.8s" begin="-1.1s" repeatCount="indefinite"/></circle>
<circle cx="700" cy="216" r="1.2" fill="#dbe7ff"><animate attributeName="opacity" values="0.08;0.8;0.08" dur="4s" begin="-2.2s" repeatCount="indefinite"/></circle>
<circle cx="150" cy="216" r="1.4" fill="#dbe7ff"><animate attributeName="opacity" values="0.08;0.8;0.08" dur="3.6s" begin="-0.5s" repeatCount="indefinite"/></circle>
</g>
<text x="36" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#8b949e">ONE PIPELINE &#183; FIVE STATIONS</text>

<!-- connector -->
<line x1="92" y1="115" x2="748" y2="115" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 8">
<animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.8s" repeatCount="indefinite"/>
</line>
<g stroke="#58a6ff" stroke-width="1.5" fill="none" opacity="0.55">
<polyline points="181,111 187,115 181,119"/>
<polyline points="336,111 342,115 336,119"/>
<polyline points="491,111 497,115 491,119"/>
<polyline points="646,111 652,115 646,119"/>
</g>

<!-- halos -->
<circle cx="110" cy="115" r="26" fill="none" stroke="#f0883e" stroke-width="1.5"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
<circle cx="265" cy="115" r="26" fill="none" stroke="#58a6ff" stroke-width="1.5"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
<circle cx="420" cy="115" r="26" fill="none" stroke="#a78bfa" stroke-width="1.5"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
<circle cx="575" cy="115" r="26" fill="none" stroke="#3fb950" stroke-width="1.5"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>
<circle cx="730" cy="115" r="26" fill="none" stroke="#22d3ee" stroke-width="1.5"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle>

<!-- nodes -->
<circle cx="110" cy="115" r="18" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
<circle cx="265" cy="115" r="18" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
<circle cx="420" cy="115" r="18" fill="#0d1117" stroke="#a78bfa" stroke-width="2"/>
<circle cx="575" cy="115" r="18" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
<circle cx="730" cy="115" r="18" fill="#0d1117" stroke="#22d3ee" stroke-width="2"/>

<!-- glyphs -->
<g stroke="#e6edf3" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M110,107 L117,110 L117,116 C117,121 110,124 110,124 C110,124 103,121 103,116 L103,110 Z"/>
<path d="M106.5,115 L109.5,118 L114,112.5"/>
<circle cx="261" cy="111" r="2.4"/><circle cx="269" cy="111" r="2.4"/><circle cx="265" cy="119" r="2.4"/>
<line x1="261" y1="111" x2="269" y2="111"/><line x1="261" y1="111" x2="265" y2="119"/><line x1="269" y1="111" x2="265" y2="119"/>
<rect x="413" y="108" width="14" height="4" rx="1"/><rect x="413" y="113.5" width="14" height="4" rx="1"/><rect x="413" y="119" width="14" height="4" rx="1"/>
<path d="M575,107 L575,111 M572,109 L575,106 L578,109"/>
<rect x="568" y="113" width="14" height="10" rx="2"/>
<circle cx="730" cy="115" r="4.5"/>
<line x1="736" y1="115" x2="739.5" y2="115"/><line x1="733" y1="120.2" x2="734.75" y2="123.2"/><line x1="727" y1="120.2" x2="725.25" y2="123.2"/><line x1="724" y1="115" x2="720.5" y2="115"/><line x1="727" y1="109.8" x2="725.25" y2="106.8"/><line x1="733" y1="109.8" x2="734.75" y2="106.8"/>
</g>

<!-- traveling pulse -->
<circle r="9" fill="#e6edf3" opacity="0.15" filter="url(#vcglow)"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M92,115 L748,115"/></circle>
<circle r="3.5" fill="#ffffff"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M92,115 L748,115"/></circle>

<!-- labels -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
<text x="110" y="165" font-size="14" font-weight="bold" fill="#f0883e" letter-spacing="1">GATE</text>
<text x="265" y="165" font-size="14" font-weight="bold" fill="#58a6ff" letter-spacing="1">MAP</text>
<text x="420" y="165" font-size="14" font-weight="bold" fill="#a78bfa" letter-spacing="1">REMEMBER</text>
<text x="575" y="165" font-size="14" font-weight="bold" fill="#3fb950" letter-spacing="1">SHIP</text>
<text x="730" y="165" font-size="14" font-weight="bold" fill="#22d3ee" letter-spacing="1">OPERATE</text>
<text x="110" y="184" font-size="10.5" fill="#8b949e">gate the diff</text>
<text x="265" y="184" font-size="10.5" fill="#8b949e">map the codebase</text>
<text x="420" y="184" font-size="10.5" fill="#8b949e">remember across sessions</text>
<text x="575" y="184" font-size="10.5" fill="#8b949e">ship the tool</text>
<text x="730" y="184" font-size="10.5" fill="#8b949e">operate the product</text>
<text x="110" y="200" font-size="10.5" fill="#6e7681">turbo-flow</text>
<text x="265" y="200" font-size="10.5" fill="#6e7681">codescope</text>
<text x="420" y="200" font-size="10.5" fill="#6e7681">git-versioned memory</text>
<text x="575" y="200" font-size="10.5" fill="#6e7681">7 crates</text>
<text x="730" y="200" font-size="10.5" fill="#6e7681">Ancuria</text>
</g>
</svg>
