<svg xmlns="http://www.w3.org/2000/svg" width="224" height="50" viewBox="0 0 224 50" role="img" aria-labelledby="title">
  <title id="title">Hire Me</title>
  <defs>
    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#101b32"/>
      <stop offset="1" stop-color="#10152a"/>
    </linearGradient>
    <linearGradient id="edge">
      <stop stop-color="#22d3ee" stop-opacity=".72"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="light">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67e8f9" stop-opacity=".24"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="inside">
      <rect x="1" y="1" width="222" height="48" rx="12"/>
    </clipPath>
  </defs>
  <style>
    .sweep { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .sweep { animation: sweep 3.4s ease-in-out .35s; }
    }
    @keyframes sweep {
      from { opacity: 1; transform: translateX(-74px); }
      to { opacity: 1; transform: translateX(224px); }
    }
  </style>
  <rect x=".5" y=".5" width="223" height="49" rx="13" fill="url(#panel)" stroke="url(#edge)"/>
  <g clip-path="url(#inside)">
    <rect class="sweep" width="74" height="50" fill="url(#light)"/>
  </g>
  <circle cx="61" cy="25" r="8" fill="#22d3ee" fill-opacity=".15"/>
  <circle cx="61" cy="25" r="3.5" fill="#67e8f9"/>
  <text x="125" y="32" text-anchor="middle" fill="#f1f5ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Hire Me</text>
</svg>
