<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" role="img" aria-label="The ecosystem as a line with eight stops: turboflow.online, turbo-rig.com, agenticplatformengineering.com, adventureonthewave.com, creandotumatrix.com, turboflowuniversity.space, ancuria.mx and sdelic.org.">
<title>Ecosystem Sites</title>
<defs>
<filter id="esglow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="840" height="230" rx="12" fill="#04060c" stroke="#10161f"/>
<g>
<circle cx="70" cy="50" r="1.2" fill="#dbe7ff"><animate attributeName="opacity" values="0.08;0.8;0.08" dur="3.3s" repeatCount="indefinite"/></circle>
<circle cx="770" cy="44" r="1.4" fill="#dbe7ff"><animate attributeName="opacity" values="0.08;0.8;0.08" dur="2.8s" begin="-1.1s" repeatCount="indefinite"/></circle>
<circle cx="420" cy="30" r="1.2" fill="#dbe7ff"><animate attributeName="opacity" values="0.08;0.8;0.08" dur="3.9s" begin="-2s" repeatCount="indefinite"/></circle>
</g>
<text x="36" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#22d3ee">THE ECOSYSTEM &#183; EIGHT SITES</text>

<!-- rail -->
<line x1="60" y1="130" x2="780" y2="130" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 8">
<animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.8s" repeatCount="indefinite"/>
</line>
<circle cx="60" cy="130" r="3" fill="#30363d"/>
<circle cx="780" cy="130" r="3" fill="#30363d"/>

<!-- train -->
<circle r="8" fill="#e6edf3" opacity="0.12" filter="url(#esglow)"><animateMotion dur="8s" begin="-3s" repeatCount="indefinite" path="M70,130 L770,130"/></circle>
<circle r="3.5" fill="#ffffff"><animateMotion dur="8s" begin="-3s" repeatCount="indefinite" path="M70,130 L770,130"/></circle>

<!-- stops -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#8b949e" text-anchor="middle">
<circle cx="94" cy="130" r="11" fill="none" stroke="#22d3ee" stroke-opacity="0.35"><animate attributeName="opacity" values="0.3;1;0.3" dur="5.6s" repeatCount="indefinite"/></circle>
<circle cx="94" cy="130" r="5.5" fill="#0d1117" stroke="#22d3ee" stroke-width="2"/>
<text x="94" y="106">turboflow.online</text>

<circle cx="188" cy="130" r="11" fill="none" stroke="#a78bfa" stroke-opacity="0.35"><animate attributeName="opacity" values="0.3;1;0.3" dur="5.6s" begin="-0.7s" repeatCount="indefinite"/></circle>
<circle cx="188" cy="130" r="5.5" fill="#0d1117" stroke="#a78bfa" stroke-width="2"/>
<text x="188" y="162">turbo-rig.com</text>

<circle cx="282" cy="130" r="11" fill="none" stroke="#58a6ff" stroke-opacity="0.35"><animate attributeName="opacity" values="0.3;1;0.3" dur="5.6s" begin="-1.4s" repeatCount="indefinite"/></circle>
<circle cx="282" cy="130" r="5.5" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
<text x="282" y="106">agenticplatformengineering.com</text>

<circle cx="376" cy="130" r="11" fill="none" stroke="#f0883e" stroke-opacity="0.35"><animate attributeName="opacity" values="0.3;1;0.3" dur="5.6s" begin="-2.1s" repeatCount="indefinite"/></circle>
<circle cx="376" cy="130" r="5.5" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
<text x="376" y="162">adventureonthewave.com</text>

<circle cx="470" cy="130" r="11" fill="none" stroke="#a78bfa" stroke-opacity="0.35"><animate attributeName="opacity" values="0.3;1;0.3" dur="5.6s" begin="-2.8s" repeatCount="indefinite"/></circle>
<circle cx="470" cy="130" r="5.5" fill="#0d1117" stroke="#a78bfa" stroke-width="2"/>
<text x="470" y="106">creandotumatrix.com</text>

<circle cx="564" cy="130" r="11" fill="none" stroke="#22d3ee" stroke-opacity="0.35"><animate attributeName="opacity" values="0.3;1;0.3" dur="5.6s" begin="-3.5s" repeatCount="indefinite"/></circle>
<circle cx="564" cy="130" r="5.5" fill="#0d1117" stroke="#22d3ee" stroke-width="2"/>
<text x="564" y="162">turboflowuniversity.space</text>

<circle cx="658" cy="130" r="11" fill="none" stroke="#3fb950" stroke-opacity="0.35"><animate attributeName="opacity" values="0.3;1;0.3" dur="5.6s" begin="-4.2s" repeatCount="indefinite"/></circle>
<circle cx="658" cy="130" r="5.5" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
<text x="658" y="106">ancuria.mx</text>

<circle cx="752" cy="130" r="11" fill="none" stroke="#f85149" stroke-opacity="0.35"><animate attributeName="opacity" values="0.3;1;0.3" dur="5.6s" begin="-4.9s" repeatCount="indefinite"/></circle>
<circle cx="752" cy="130" r="5.5" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
<text x="752" y="162">sdelic.org</text>
</g>

<text x="420" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#8b949e">ONE OPERATOR &#183; EIGHT LIVE SITES</text>
</svg>
